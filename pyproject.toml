[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flux-bend"
version = "0.1.0"
description = "Deterministic model bending tool for FLUX.2 Klein Base 4B"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "safetensors",
    "diffusers",
    "huggingface_hub",
    "transformers",
    "Pillow",
    "pyyaml",
    "alive-progress",
    "sentencepiece",
    "protobuf",
    "accelerate",
]

[project.optional-dependencies]
analysis = ["lpips", "torchmetrics"]

[project.scripts]
flux-bend = "flux_bend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_bend"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]
