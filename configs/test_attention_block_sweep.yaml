model: black-forest-labs/FLUX.2-klein-base-4B
prompt: "a ceramic vase on a wooden table, soft window light"
seed: 42
inference:
  steps: 50
  guidance_scale: 4.0
  width: 1024
  height: 1024
sweeps:
  - mode: attn_head_scale
    grid:
      rows: heads
      cols: strength
    params:
      heads: [[0,1], [12,13], [22,23]]
      strength: [0.2, 0.5, 1.0, 1.5]
      block_type: double
      start_block: 0
      end_block: 4
