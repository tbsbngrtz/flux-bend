# configs/attn_vs_mlp.yaml
model: black-forest-labs/FLUX.2-klein-base-4B
prompt: "A whimsical frog in a tailored suit riding a huge mouse with a leather saddle, holding a black top hat in one hand, watercolor illustration, meadow background with soft wildflowers and green grass, gentle daylight, playful storybook mood, fine brush textures, delicate paper grain, natural pastel color palette, clear subject focus, charming detailed character design, full body view, slightly low angle composition."
seed: 12345
inference:
  steps: 50
  guidance_scale: 4.0
  width: 1024
  height: 1024
sweeps:
  - mode: block_dropout
    grid:
      rows: block_indices
      cols: target
    params:
      block_type: single
      block_indices: [[4], [5], [10], [15], [19]]
      scale: 0.0
      target: [attn, mlp]